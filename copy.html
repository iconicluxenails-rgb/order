<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>Copy message · Iconic Luxe Nails</title>
<style>
  :root { --pink: #E0218A; --pink-fill: #C81A7A; --text: #f6f6f6; --muted: #a9a9a9; --card: #111; --line: #2a2a2a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 24px 16px 40px; }
  .logo { display: block; width: 180px; max-width: 60%; height: auto; margin: 4px auto 22px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
  p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  .msg { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; white-space: pre-wrap; word-break: break-word; font-size: 15px; user-select: all; -webkit-user-select: all; }
  button { display: block; width: 100%; margin-top: 18px; padding: 16px; border: 0; border-radius: 999px; background: var(--pink-fill); color: #fff; font: inherit; font-weight: 600; font-size: 17px; cursor: pointer; }
  button:active { transform: scale(.99); }
  button.done { background: #1f7a4a; }
  .status { min-height: 22px; margin-top: 12px; text-align: center; font-size: 14px; color: var(--muted); }
  .empty { text-align: center; padding: 30px 0; }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo-white_1.png" alt="Iconic Luxe Nails" width="640" height="342">
  <div id="app">
    <h1>Receipt message</h1>
    <p>Tap Copy, then paste it into Viber, Instagram, email or any chat.</p>
    <div class="msg" id="msg"></div>
    <button type="button" id="copy">Copy message</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </div>
</main>
<script>
  // The message travels in the part of the link after "#", so it never reaches any server.
  var text = '';
  try { text = decodeURIComponent((location.hash || '').slice(1)); } catch (e) { text = (location.hash || '').slice(1); }
  var msg = document.getElementById('msg'), btn = document.getElementById('copy'), status = document.getElementById('status');

  if (!text.trim()) {
    document.getElementById('app').innerHTML = '<p class="empty">There is no message to copy. Open this from the staff app.</p>';
  } else {
    msg.textContent = text;
  }

  function fallbackCopy() {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0'; ta.style.top = '0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }
  function done(ok) {
    if (ok) {
      btn.textContent = 'Copied ✓'; btn.className = 'done';
      status.textContent = 'Now paste it into the chat. You can close this page.';
    } else {
      status.textContent = 'Could not copy automatically. Press and hold the message above, then choose Copy.';
    }
  }
  function copy() {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(fallbackCopy()); });
    } else {
      done(fallbackCopy());
    }
  }
  if (btn) btn.addEventListener('click', copy);
</script>
</body>
</html>
